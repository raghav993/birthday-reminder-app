name: 🚀 Deploy to birthday-remider.is-great.net

on:
  push:
    branches:
      - master

jobs:
  ftp-deploy:
    name: 📤 Upload to Subdomain Directory
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v3

      - name: 📤 FTP Deploy to birthday-remider.is-great.net
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /htdocs/